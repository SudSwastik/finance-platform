server:
  port: 8083

spring:
  application:
    name: goals-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_dashboard?currentSchema=goals
    username: finance
    password: finance
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: goals
    open-in-view: false
  flyway:
    enabled: true
    schemas: goals
    default-schema: goals
    locations: classpath:db/migration

platform:
  security:
    dev-user-sub-enabled: true

logging:
  level:
    org.springframework.security: INFO
