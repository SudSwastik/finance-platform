openapi: 3.1.0
info:
  title: Ledger Service API
  version: 1.0.0
servers:
  - url: http://localhost:8084
tags:
  - name: Transactions
paths:
  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List recent transactions for current user
      operationId: listTransactions
      security:
        - bearerAuth: []
        - devUserSub: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Transactions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    devUserSub:
      type: apiKey
      in: header
      name: X-Dev-User-Sub
  responses:
    Unauthorized:
      description: Unauthorized
  schemas:
    Money:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      example: '-128.45'
    TransactionItem:
      type: object
      required: [id, merchant, category, amount, date]
      properties:
        id:       { type: string, format: uuid }
        merchant: { type: string }
        category:
          type: string
          enum: [essential, lifestyle, occasional, other]
        amount:   { $ref: '#/components/schemas/Money' }
        date:     { type: string, format: date }
