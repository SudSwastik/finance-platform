openapi: 3.1.0
info:
  title: Goals Service API
  version: 1.0.0
servers:
  - url: http://localhost:8083
tags:
  - name: Goals
paths:
  /api/v1/goals:
    get:
      tags: [Goals]
      summary: List savings goals for current user
      operationId: listGoals
      security:
        - bearerAuth: []
        - devUserSub: []
      responses:
        '200':
          description: Goals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    devUserSub:
      type: apiKey
      in: header
      name: X-Dev-User-Sub
  responses:
    Unauthorized:
      description: Unauthorized
  schemas:
    Money:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      example: '2300.00'
    GoalItem:
      type: object
      required: [id, name, current, target, percent, colorToken, targetDate]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        current:      { $ref: '#/components/schemas/Money' }
        target:       { $ref: '#/components/schemas/Money' }
        percent:      { type: number }
        colorToken:   { type: string }
        targetDate:   { type: string }
