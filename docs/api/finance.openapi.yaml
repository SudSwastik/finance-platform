openapi: 3.1.0
info:
  title: Finance Service
  version: 0.1.0
  description: Accounts, transactions (bank/card/brokerage/crypto). Port 8084.

servers:
  - url: http://localhost:8084

paths:
  /api/v1/finance/accounts:
    get:
      operationId: listAccounts
      summary: List all accounts for the authenticated user
      security:
        - devUserSub: []
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountDto"
        "401":
          description: Not authenticated

  /api/v1/finance/transactions:
    get:
      operationId: listTransactions
      summary: Paginated, filtered transaction list
      security:
        - devUserSub: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: typeGroup
          in: query
          description: "INCOME | EXPENSE | TRANSFERS (omit = All)"
          schema: { type: string, enum: [INCOME, EXPENSE, TRANSFERS] }
        - name: search
          in: query
          schema: { type: string }
        - name: month
          in: query
          description: "YYYY-MM"
          schema: { type: string, example: "2026-06" }
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, SETTLED, FAILED, REVERSED] }
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPageDto"
        "401":
          description: Not authenticated

  /api/v1/finance/transactions/stats:
    get:
      operationId: getTransactionStats
      summary: Money in / out / net flow totals and counts for a month
      security:
        - devUserSub: []
      parameters:
        - name: month
          in: query
          description: "YYYY-MM (defaults to current month)"
          schema: { type: string, example: "2026-06" }
      responses:
        "200":
          description: Transaction stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatsDto"
        "401":
          description: Not authenticated

  /api/v1/finance/transactions/recent:
    get:
      operationId: listRecentTransactions
      summary: Last 10 transactions sorted by date desc
      security:
        - devUserSub: []
      responses:
        "200":
          description: Recent transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentTransactionDto"
        "401":
          description: Not authenticated

  /api/v1/finance/transactions/monthly-summary:
    get:
      operationId: getMonthlySummary
      summary: Income, spending and net saved for the current month
      security:
        - devUserSub: []
      responses:
        "200":
          description: Monthly summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySummaryDto"
        "401":
          description: Not authenticated

  /api/v1/finance/transactions/recurring:
    get:
      operationId: listRecurringTransactions
      summary: List recurring transactions for the overview widget
      security:
        - devUserSub: []
      responses:
        "200":
          description: List of recurring transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringTransactionDto"
        "401":
          description: Not authenticated

components:
  securitySchemes:
    devUserSub:
      type: apiKey
      in: header
      name: X-Dev-User-Sub

  schemas:
    AccountDto:
      type: object
      required: [id, type, name, currency]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [BANK, CREDIT_CARD, BROKERAGE, CRYPTO_WALLET]
        name:
          type: string
        currency:
          type: string
          example: INR

    TransactionPageDto:
      type: object
      required: [content, totalElements, page, size, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TransactionDto"
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
        totalPages:
          type: integer

    TransactionDto:
      type: object
      required: [id, type, status, amount, transactionDate]
      properties:
        id:
          type: string
          format: uuid
        merchantName:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT, BUY, SELL, TRANSFER, FEE]
        status:
          type: string
          enum: [PENDING, SETTLED, FAILED, REVERSED]
        amount:
          type: string
          description: Decimal string
          example: "84.20"
        transactionDate:
          type: string
          format: date
        accountName:
          type: string

    TransactionStatsDto:
      type: object
      required: [moneyIn, moneyInCount, moneyOut, moneyOutCount, netFlow, totalCount]
      properties:
        moneyIn:
          type: string
          description: Decimal string
        moneyInCount:
          type: integer
          format: int64
        moneyOut:
          type: string
          description: Decimal string
        moneyOutCount:
          type: integer
          format: int64
        netFlow:
          type: string
          description: Decimal string (moneyIn − moneyOut)
        totalCount:
          type: integer
          format: int64

    RecentTransactionDto:
      type: object
      required: [id, type, amount, transactionDate]
      properties:
        id:
          type: string
          format: uuid
        merchantName:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT, BUY, SELL, TRANSFER, FEE]
        amount:
          type: string
          description: Decimal string
          example: "84.20"
        transactionDate:
          type: string
          format: date

    MonthlySummaryDto:
      type: object
      required: [income, spending, netSaved]
      properties:
        income:
          type: string
          description: Decimal string
          example: "85000.00"
        spending:
          type: string
          description: Decimal string
          example: "45000.00"
        netSaved:
          type: string
          description: Decimal string (income − spending)
          example: "40000.00"

    RecurringTransactionDto:
      type: object
      required: [name, frequency, amount, nextDate]
      properties:
        name:
          type: string
          example: Spotify Premium
        frequency:
          type: string
          example: Monthly
        amount:
          type: string
          description: Decimal string (never float)
          example: "10.99"
        nextDate:
          type: string
          format: date
          example: "2025-07-15"
