openapi: 3.1.0
info:
  title: Identity Service
  version: 0.1.0
  description: Tenant and user management. Port 8082.

servers:
  - url: http://localhost:8082

paths:
  /api/v1/identity/me:
    get:
      operationId: getMyProfile
      summary: Get the authenticated user's profile
      security:
        - devUserSub: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileDto"
        "401":
          description: Not authenticated
        "404":
          description: User not found in identity store
    post:
      operationId: provisionMyProfile
      summary: >
        Create the authenticated user's tenant + profile if they don't already exist.
        Idempotent — calling this again for an already-provisioned sub returns the
        existing profile unchanged rather than erroring or creating a duplicate.
      security:
        - devUserSub: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionProfileRequestDto"
      responses:
        "200":
          description: Profile (just created, or already existed for this sub)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileDto"
        "400":
          description: Validation error
        "401":
          description: Not authenticated

components:
  securitySchemes:
    devUserSub:
      type: apiKey
      in: header
      name: X-Dev-User-Sub

  schemas:
    UserProfileDto:
      type: object
      required: [userId, tenantId, userSub, email]
      properties:
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        userSub:
          type: string
        email:
          type: string

    ProvisionProfileRequestDto:
      type: object
      required: [name, email, accountType]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        accountType:
          type: string
          enum: [personal, business]
