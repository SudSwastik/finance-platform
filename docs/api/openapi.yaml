openapi: 3.1.0
info:
  title: Finance Platform API (BFF / early merged spec)
  version: 1.0.0
  description: |
    Early combined contract for dashboard-bff (overview, health, me).
    Per-service specs are the source of truth for domain modules — see docs/api/README.md
    and ADR-0007 (activity-log.openapi.yaml, budget.openapi.yaml, etc.).
    Regenerate Postman after changes.

servers:
  - url: http://localhost:8081
    description: Local Spring Boot

tags:
  - name: Health
  - name: Identity
  - name: Dashboard

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/me:
    get:
      tags: [Identity]
      summary: Current authenticated user
      operationId: getMe
      security:
        - bearerAuth: []
        - devUserSub: []
      responses:
        '200':
          description: User profile from JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Aggregated overview for dashboard mockup widgets
      operationId: getDashboardOverview
      security:
        - bearerAuth: []
        - devUserSub: []
      responses:
        '200':
          description: Overview data scoped to authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token (production)
    devUserSub:
      type: apiKey
      in: header
      name: X-Dev-User-Sub
      description: Local dev only — maps to seed user_sub (disabled in prod)

  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP

    MeResponse:
      type: object
      required: [sub, groups]
      properties:
        sub:
          type: string
          description: Cognito subject
        groups:
          type: array
          items:
            type: string

    Money:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      example: '128.45'

    OverviewResponse:
      type: object
      required: [totalBudgets, investments, recurring, recentTransactions, monthlySummary]
      properties:
        totalBudgets:
          $ref: '#/components/schemas/TotalBudgetsSection'
        investments:
          type: array
          items:
            $ref: '#/components/schemas/HoldingItem'
        recurring:
          type: array
          items:
            $ref: '#/components/schemas/RecurringItem'
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/RecentTransactionItem'
        monthlySummary:
          $ref: '#/components/schemas/MonthlySummary'

    TotalBudgetsSection:
      type: object
      properties:
        total:
          $ref: '#/components/schemas/Money'
        filter:
          type: string
          example: Expenses
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BudgetCategoryItem'

    BudgetCategoryItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        colorToken: { type: string }
        spent: { $ref: '#/components/schemas/Money' }
        budget: { $ref: '#/components/schemas/Money' }
        percentUsed: { type: number }

    SpendingSection:
      type: object
      properties:
        currentTotal: { $ref: '#/components/schemas/Money' }
        comparisonLabel: { type: string }
        series:
          type: array
          items:
            $ref: '#/components/schemas/SpendingPoint'

    SpendingPoint:
      type: object
      properties:
        date: { type: string, format: date }
        thisMonth: { $ref: '#/components/schemas/Money' }
        lastMonth: { $ref: '#/components/schemas/Money' }

    TransactionItem:
      type: object
      properties:
        id: { type: string }
        merchant: { type: string }
        category: { type: string, enum: [essential, lifestyle, occasional, other] }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }

    HoldingItem:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        name: { type: string }
        costBasis: { $ref: '#/components/schemas/Money' }
        changePercent: { type: number }
        value: { $ref: '#/components/schemas/Money' }

    RecurringItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        frequency: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        nextDate: { type: string, format: date }

    RecentTransactionItem:
      type: object
      required: [id, type, amount, transactionDate]
      properties:
        id: { type: string, format: uuid }
        merchantName: { type: string }
        category: { type: string }
        type:
          type: string
          enum: [DEBIT, CREDIT, BUY, SELL, TRANSFER, FEE]
        amount: { $ref: '#/components/schemas/Money' }
        transactionDate: { type: string, format: date }

    MonthlySummary:
      type: object
      required: [income, spending, netSaved]
      properties:
        income: { $ref: '#/components/schemas/Money' }
        spending: { $ref: '#/components/schemas/Money' }
        netSaved: { $ref: '#/components/schemas/Money' }

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
