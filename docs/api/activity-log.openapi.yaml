openapi: 3.1.0
info:
  title: Activity Log Service API
  version: 1.0.0
  description: |
    Bounded context for Activity Log (sidebar nav).
    Implemented only in backend/activity-log-service.
    UI typically calls dashboard-bff; BFF may proxy to this service.

servers:
  - url: http://localhost:8082
    description: activity-log-service (local)

tags:
  - name: ActivityLog

paths:
  /api/v1/activity-log/entries:
    get:
      tags: [ActivityLog]
      summary: List activity log entries for current user
      operationId: listActivityLogEntries
      security:
        - bearerAuth: []
        - devUserSub: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated activity entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    devUserSub:
      type: apiKey
      in: header
      name: X-Dev-User-Sub

  responses:
    Unauthorized:
      description: Unauthorized

  schemas:
    ActivityLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLogEntry'
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    ActivityLogEntry:
      type: object
      required: [id, type, occurredAt, summary]
      properties:
        id: { type: string }
        type: { type: string, example: TRANSACTION_POSTED }
        occurredAt: { type: string, format: date-time }
        summary: { type: string }
        metadata: { type: object, additionalProperties: true }
