@switch (variant) {
  @case ('primary') {
    <button mat-flat-button [disabled]="disabled" (click)="clicked.emit()">
      <ng-content />
    </button>
  }
  @case ('secondary') {
    <button mat-stroked-button [disabled]="disabled" (click)="clicked.emit()">
      <ng-content />
    </button>
  }
  @default {
    <button mat-button [disabled]="disabled" (click)="clicked.emit()">
      <ng-content />
    </button>
  }
}
