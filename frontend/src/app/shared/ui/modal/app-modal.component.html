@let modalState = (state$ | async);
@if (modalState?.open && modalState?.config) {
  <div class="app-modal__backdrop" (click)="modalService.cancel()">
    <div class="app-modal__panel" role="dialog" [attr.aria-label]="modalState!.config!.title" (click)="$event.stopPropagation()">
      <header class="app-modal__header">
        <h2 class="app-modal__title">{{ modalState!.config!.title }}</h2>
        <button class="app-modal__close" aria-label="Close" (click)="modalService.cancel()">✕</button>
      </header>

      <div class="app-modal__body">
        @if (modalState!.config!.bodyTemplate) {
          <ng-container [ngTemplateOutlet]="modalState!.config!.bodyTemplate!" />
        } @else {
          <ng-content />
        }
      </div>

      <footer class="app-modal__footer">
        <button type="button" class="app-modal__btn app-modal__btn--cancel" (click)="modalService.cancel()">
          {{ modalState!.config!.cancelLabel ?? 'Cancel' }}
        </button>
        <button type="button" class="app-modal__btn app-modal__btn--confirm" (click)="modalService.confirm()">
          {{ modalState!.config!.confirmLabel ?? 'Confirm' }}
        </button>
      </footer>
    </div>
  </div>
}
