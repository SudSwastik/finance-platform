<nav class="sidebar" aria-label="Main navigation">
  <div class="sidebar__logo">
    <span class="sidebar__brand">FinancePlatform</span>
  </div>

  <ul class="sidebar__list" role="list">
    @for (item of navItems; track item.route) {
      <li>
        <a
          class="sidebar__link"
          [routerLink]="item.route"
          routerLinkActive="sidebar__link--active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          @if (item.icon) {
            <span class="sidebar__icon" aria-hidden="true">{{ item.icon }}</span>
          }
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="sidebar__footer">
    <a class="sidebar__footer-link" routerLink="/settings">Settings</a>
    <div class="sidebar__profile">
      <div class="sidebar__avatar" aria-hidden="true">{{ userInitials }}</div>
      <span class="sidebar__username">{{ userName }}</span>
    </div>
  </div>
</nav>
