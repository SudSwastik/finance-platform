<app-auth-shell navText="Have an account?" navLinkText="Login" navLinkPath="/login">
  <div class="register-page">
    <div class="register-page__card">

      <div class="register-page__avatar-wrap">
        <div class="register-page__avatar">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <div class="register-page__avatar-plus">+</div>
      </div>

      <h1 class="register-page__title">Create a new account</h1>
      <p class="register-page__subtitle">Enter your details to register.</p>

      <form class="register-page__form" (ngSubmit)="onSubmit()">
        <div class="register-page__fields">

          <div class="register-page__field">
            <span class="register-page__field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </span>
            <input
              class="register-page__input"
              type="text"
              placeholder="Ex: John doe"
              [(ngModel)]="name"
              name="name"
              autocomplete="name"
            />
          </div>

          <div class="register-page__field">
            <span class="register-page__field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </span>
            <input
              class="register-page__input"
              type="email"
              placeholder="Ex: Johndoe@financial.com"
              [(ngModel)]="email"
              name="email"
              autocomplete="email"
            />
          </div>

          <div class="register-page__field">
            <span class="register-page__field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1C9.24 1 7 3.24 7 6v1H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2h-1V6c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V6c0-1.66 1.34-3 3-3zm0 9c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/>
              </svg>
            </span>
            <input
              class="register-page__input"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              [value]="password()"
              (input)="onPasswordChange($any($event.target).value)"
              name="password"
              autocomplete="new-password"
            />
            <button type="button" class="register-page__field-eye" (click)="togglePassword()">
              @if (showPassword) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zm4.53 4.53l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              }
            </button>
          </div>

        </div>

        <p class="register-page__hint">Must contain 1 uppercase letter, 1 number, min. 8 characters</p>

        <div class="register-page__strength-wrap">
          <span class="register-page__strength-label">Password Strength</span>
          <div class="register-page__strength-bar">
            <div class="register-page__strength-seg" [class]="'register-page__strength-seg--' + (strength() >= 1 ? strengthLabel().toLowerCase() : 'empty')"></div>
            <div class="register-page__strength-seg" [class]="'register-page__strength-seg--' + (strength() >= 2 ? strengthLabel().toLowerCase() : 'empty')"></div>
            <div class="register-page__strength-seg" [class]="'register-page__strength-seg--' + (strength() >= 3 ? strengthLabel().toLowerCase() : 'empty')"></div>
          </div>
        </div>

        <button class="register-page__submit" type="submit">Sign Up</button>

        <p class="register-page__terms">
          By clicking Register, you agree to accept <strong>LOGO Financial's</strong> Terms and Condition
        </p>
      </form>

    </div>
  </div>
</app-auth-shell>
