<app-auth-card
  title="Verify your phone number with a code"
  subtitle="It helps your account to keep secure."
  primaryLabel="Continue"
  iconVariant="default"
  (primaryClick)="onContinue()">
  <svg slot="icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
  </svg>

  <div class="phone-number-page__field-wrap">
    <label class="phone-number-page__label">Phone Number</label>
    <div class="phone-number-page__field">
      <span class="phone-number-page__code">
        <span class="phone-number-page__flag">🇺🇸</span>
        <span>+1</span>
      </span>
      <input
        class="phone-number-page__input"
        type="tel"
        placeholder="Your phone number"
        [(ngModel)]="phone"
        name="phone"
        autocomplete="tel-national"
      />
    </div>
  </div>
</app-auth-card>
