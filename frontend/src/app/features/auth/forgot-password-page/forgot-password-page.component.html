<app-auth-shell navText="Have an account?" navLinkText="Login" navLinkPath="/login">
  <app-auth-card
    title="Forgot Your Password"
    subtitle="Enter your registered email to request a password reset code."
    [primaryLabel]="submitting ? 'Sending…' : 'Send reset code'"
    [primaryDisabled]="submitting"
    iconVariant="dark"
    (primaryClick)="onSend()">
    <svg slot="icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 1C9.24 1 7 3.24 7 6v1H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2h-1V6c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V6c0-1.66 1.34-3 3-3zm0 9c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/>
    </svg>

    <form (ngSubmit)="onSend()">
    <div class="forgot-password-page__field">
      <span class="forgot-password-page__field-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </span>
      <input
        class="forgot-password-page__input"
        type="email"
        placeholder="you@example.com"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        required
        [disabled]="submitting"
      />
    </div>
    </form>
    @if (errorMessage) {
      <p class="text-negative" role="alert">{{ errorMessage }}</p>
    }
  </app-auth-card>
</app-auth-shell>
