<app-auth-shell navText="Have an account?" navLinkText="Login" navLinkPath="/login">
  <app-auth-card
    [title]="completed ? 'Password reset' : 'Reset your password'"
    [subtitle]="completed ? 'Your password has been updated. Sign in with your new password.' : 'If your account is eligible, a reset code will arrive at your registered email or phone. Enter it below with your new password.'"
    [primaryLabel]="completed ? 'Back to login' : submitting ? 'Resetting…' : 'Reset password'"
    [primaryDisabled]="submitting"
    iconVariant="green-filled"
    (primaryClick)="onContinue()">
    <svg slot="icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
      <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
    </svg>
    @if (!completed) {
      <form class="forgot-password-success-page__form" (ngSubmit)="onContinue()">
        <fieldset class="forgot-password-success-page__fields" [disabled]="submitting">
          <label>
            Email
            <input type="email" name="email" [(ngModel)]="email" autocomplete="email" required />
          </label>
          <label>
            Reset code
            <input type="text" name="code" [(ngModel)]="code" autocomplete="one-time-code" required />
          </label>
          <label>
            New password
            <input type="password" name="password" [(ngModel)]="password" autocomplete="new-password" required />
          </label>
          <label>
            Confirm new password
            <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password" required />
          </label>
        </fieldset>
      </form>
      @if (errorMessage) {
        <p class="text-negative" role="alert">{{ errorMessage }}</p>
      }
    }
    <a slot="secondary" routerLink="/forgot-password">Request another code</a>
  </app-auth-card>
</app-auth-shell>
