<app-auth-shell navText="Have an account?" navLinkText="Login" navLinkPath="/login">
  <app-auth-card
    title="Success send a link"
    subtitle="Open link at your email and reset your password and make a new password again."
    primaryLabel="Continue"
    iconVariant="green-filled"
    (primaryClick)="onContinue()">
    <svg slot="icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
      <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
    </svg>
  </app-auth-card>
</app-auth-shell>
