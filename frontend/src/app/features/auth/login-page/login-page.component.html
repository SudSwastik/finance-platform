<app-auth-shell navText="Don't have an account?" navLinkText="Register" navLinkPath="/register">
  <div class="login-page">
    <div class="login-page__card">

      <div class="login-page__avatar-wrap">
        <div class="login-page__avatar">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <div class="login-page__avatar-plus">+</div>
      </div>

      <h1 class="login-page__title">Login to your account</h1>
      <p class="login-page__subtitle">Enter your details to login.</p>

      <form class="login-page__form" (ngSubmit)="onSubmit()">
        <div class="login-page__fields">

          <div class="login-page__field">
            <span class="login-page__field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </span>
            <input
              class="login-page__input"
              type="email"
              placeholder="Ex: z@financial.com"
              [(ngModel)]="email"
              name="email"
              autocomplete="email"
            />
          </div>

          <div class="login-page__field">
            <span class="login-page__field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1C9.24 1 7 3.24 7 6v1H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2h-1V6c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V6c0-1.66 1.34-3 3-3zm0 9c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/>
              </svg>
            </span>
            <input
              class="login-page__input"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
            />
            <button type="button" class="login-page__field-eye" (click)="togglePassword()">
              @if (showPassword) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zm4.53 4.53l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              }
            </button>
          </div>

        </div>

        <div class="login-page__row">
          <label class="login-page__remember">
            <input class="login-page__checkbox" type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            Remember me
          </label>
          <a class="login-page__forgot" routerLink="/forgot-password">Forgot Password?</a>
        </div>

        @if (errorMessage) {
          <p class="text-negative login-page__error">{{ errorMessage }}</p>
        }

        <button class="login-page__submit" type="submit" [disabled]="submitting">
          {{ submitting ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

    </div>
  </div>
</app-auth-shell>
