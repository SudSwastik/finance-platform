<app-dashboard-card>
  <div class="spending-this-month">

    <div class="spending-this-month__header">
      <div>
        <h2 class="spending-this-month__title text-card-title">Spending this month</h2>
        <span class="spending-this-month__kpi text-kpi">{{ formatMoney(data.totalThisMonth) }}</span>
      </div>
      <span class="spending-this-month__compare text-meta text-secondary">This month vs. last ▾</span>
    </div>

    <div class="spending-this-month__chart" role="img" aria-label="Spending comparison line chart">
      <svg [attr.viewBox]="svgViewBox" class="spending-this-month__svg" aria-hidden="true">
        <polyline
          class="spending-this-month__line spending-this-month__line--last"
          [attr.points]="polylinePoints('lastMonth')"
          fill="none"
        />
        <polyline
          class="spending-this-month__line spending-this-month__line--current"
          [attr.points]="polylinePoints('thisMonth')"
          fill="none"
        />
        @for (t of xLabels; track t.x) {
          <text
            class="spending-this-month__tick"
            [attr.x]="t.x"
            y="107"
            text-anchor="middle"
          >{{ t.label }}</text>
        }
      </svg>
    </div>

    <div class="spending-this-month__legend">
      <span class="spending-this-month__legend-item spending-this-month__legend-item--current">This month</span>
      <span class="spending-this-month__legend-item spending-this-month__legend-item--last">Last month</span>
    </div>

  </div>
</app-dashboard-card>
