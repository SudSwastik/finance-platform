<app-dashboard-card>
  <div class="recurring-widget">

    <div class="recurring-widget__header">
      <h2 class="text-card-title">Upcoming</h2>
      <a class="recurring-widget__manage" routerLink="/subscriptions">Manage</a>
    </div>

    <div class="recurring-widget__list">
      @for (bill of bills; track bill.id) {
        <div class="recurring-widget__row">
          <div class="recurring-widget__icon" aria-hidden="true">
            <i class="ph ph-arrows-clockwise"></i>
          </div>
          <div class="recurring-widget__info">
            <span class="recurring-widget__name">{{ bill.name }}</span>
            <span class="recurring-widget__date">{{ fmtDate(bill.nextDate) }}</span>
          </div>
          <span class="recurring-widget__amount">{{ fmtAmount(bill.amount) }}</span>
        </div>
      }
    </div>

  </div>
</app-dashboard-card>
