<app-dashboard-card>
  <div class="investments-widget">

    <div class="investments-widget__header">
      <h2 class="text-card-title">Top holdings</h2>
      <i class="ph ph-dots-three investments-widget__menu" aria-label="More options"></i>
    </div>

    <div class="investments-widget__list">
      @for (h of holdings; track h.id) {
        <div class="investments-widget__row">
          <div class="investments-widget__badge">{{ h.symbol.slice(0,2) }}</div>
          <div class="investments-widget__info">
            <span class="investments-widget__symbol">{{ h.symbol }}</span>
            <span class="investments-widget__name">{{ h.name }}</span>
          </div>
          <div class="investments-widget__nums">
            <span class="investments-widget__value">{{ fmtMoney(h.value) }}</span>
            <span
              class="investments-widget__change"
              [class.investments-widget__change--pos]="isPositive(h.changePercent)"
              [class.investments-widget__change--neg]="!isPositive(h.changePercent)"
            >{{ fmtChange(h.changePercent) }}</span>
          </div>
        </div>
      }
    </div>

  </div>
</app-dashboard-card>
