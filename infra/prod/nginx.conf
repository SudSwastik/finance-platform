# Replace finance.example.com with this project's domain or subdomain.
# Host-installed Nginx; frontend and backends publish only to loopback.
server {
    listen 80;
    server_name finance.example.com;

    access_log /var/log/nginx/finance-platform.access.log;
    error_log /var/log/nginx/finance-platform.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Dev-User-Sub "";

    # Keep proxy_pass without a trailing slash to preserve /api/v1/... paths.
    location /api/v1/finance/ {
        proxy_pass http://127.0.0.1:8085;
    }
    location /api/v1/portfolio/ {
        proxy_pass http://127.0.0.1:8086;
    }
    location /api/v1/goals {
        proxy_pass http://127.0.0.1:8083;
    }
    location /api/v1/identity/ {
        proxy_pass http://127.0.0.1:8082;
    }
    location /api/v1/budgets/ {
        proxy_pass http://127.0.0.1:8084;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
